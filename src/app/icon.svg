<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Upward trending bar chart bars -->
  <rect x="2" y="20" width="6" height="10" rx="1.5" fill="#4ADE80"/>
  <rect x="10" y="14" width="6" height="16" rx="1.5" fill="#22D3EE"/>
  <rect x="18" y="8" width="6" height="22" rx="1.5" fill="#4ADE80"/>
  <!-- Rising arrow on top right -->
  <polyline points="22,4 28,4 28,10" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <line x1="18" y1="10" x2="28" y2="4" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round"/>
</svg>
